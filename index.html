<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Merch Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2e2e2e;
    --text: #ffffff;
    --muted: #c9c9c9;
    --low: #4ade80;
    --mid: #facc15;
    --high: #f87171;
    --accent: #FFE135;
    --accent-text: #080808;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Atkinson Hyperlegible', -apple-system, 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    padding: 16px;
  }

  h1 {
    font-size: 2.1rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 4px;
    color: var(--accent);
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 16px;
  }

  /* Order summary line items inside totals box */
  .order-items {
    margin-bottom: 4px;
  }

  .order-item-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    font-size: 1.1rem;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
  }

  .order-item-line .item-label {
    color: var(--muted);
  }

  .order-item-line .item-label em {
    font-style: normal;
    color: var(--text);
    font-weight: 900;
    margin-right: 4px;
  }

  .order-empty {
    color: #555;
    font-size: 0.95rem;
    font-style: italic;
    padding: 4px 0 8px;
    border-bottom: 1px solid var(--border);
  }

  /* Tax Toggle */
  .tax-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 2px solid #333;
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
  }

  .tax-label {
    font-size: 1.15rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text);
  }

  .toggle-switch {
    position: relative;
    width: 60px;
    height: 32px;
  }

  .toggle-switch input { opacity: 0; width: 0; height: 0; }

  .slider {
    position: absolute;
    inset: 0;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 32px;
    cursor: pointer;
    transition: 0.2s;
  }

  .slider::before {
    content: '';
    position: absolute;
    width: 22px; height: 22px;
    left: 3px; top: 3px;
    background: var(--muted);
    border-radius: 50%;
    transition: 0.2s;
  }

  input:checked + .slider { background: var(--accent); border-color: var(--accent); }
  input:checked + .slider::before { transform: translateX(28px); background: var(--accent-text); }

  /* Items */
  .items-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .item-row {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 2px solid #333;
    border-radius: var(--radius);
    padding: 12px 14px;
    gap: 12px;
  }

  .item-head {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .item-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .item-name {
    flex: 1;
    font-size: 1.25rem;
    font-weight: 900;
    letter-spacing: 0.03em;
  }

  .item-price {
    font-size: 1.25rem;
    font-weight: 900;
    color: var(--accent);
    min-width: 56px;
    text-align: right;
  }

  .var-selects {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    flex: 1;
  }

  .var-select {
    background: var(--surface2);
    border: 2px solid #444;
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 8px 10px;
    min-height: 44px;
    max-width: 100%;
    cursor: pointer;
  }

  .qty-controls {
    display: flex;
    align-items: center;
    gap: 0;
    border: 2px solid #444;
    border-radius: 8px;
    overflow: hidden;
  }

  .qty-btn {
    width: 48px;
    height: 48px;
    border: none;
    background: var(--surface2);
    color: var(--accent);
    font-size: 1.7rem;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .qty-btn:active { background: var(--accent); color: var(--accent-text); }

  .qty-display {
    width: 44px;
    text-align: center;
    font-size: 1.25rem;
    font-weight: 900;
    background: var(--bg);
    color: var(--text);
    border: none;
    border-left: 2px solid #444;
    border-right: 2px solid #444;
    height: 48px;
    line-height: 48px;
  }

  /* Totals */
  .totals-box {
    background: var(--surface);
    border: 2px solid #333;
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .total-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    font-size: 1.15rem;
    font-weight: 700;
  }

  .total-line:not(:last-child) {
    border-bottom: 1px solid #2e2e2e;
  }

  .total-line .label { color: var(--muted); font-size: 1.05rem; font-weight: 700; letter-spacing: 0.05em; }

  .grand-total {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--accent);
  }

  .grand-total .label { color: var(--text); font-size: 1.25rem; font-weight: 900; letter-spacing: 0.08em; }

  /* Complete Sale */
  .complete-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-text);
    font-family: inherit;
    font-size: 1.3rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    margin-bottom: 12px;
    transition: 0.15s;
  }

  .complete-btn:active { background: #fff2a0; }

  .complete-btn:disabled {
    background: #333;
    color: #666;
    cursor: not-allowed;
  }

  .sale-confirm {
    text-align: center;
    color: var(--low);
    font-size: 1.05rem;
    font-weight: 900;
    margin-bottom: 12px;
  }

  /* Reset */
  .reset-btn {
    width: 100%;
    padding: 16px;
    border: 2px solid #444;
    border-radius: var(--radius);
    background: var(--surface2);
    color: var(--muted);
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: 0.15s;
  }

  .reset-btn:active { background: #3a1a1a; color: var(--high); border-color: var(--high); }

  /* Export */
  .export-row {
    margin-top: 16px;
    text-align: center;
  }

  .export-btn {
    width: 100%;
    background: none;
    border: 2px solid #444;
    border-radius: var(--radius);
    color: var(--muted);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    padding: 12px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }

  .export-btn:active { border-color: var(--accent); color: var(--accent); }

  .export-btn:disabled {
    color: #555;
    border-color: #333;
    cursor: not-allowed;
  }

  /* Confirmation modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  .modal-overlay.open { display: flex; }

  .modal-box {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 24px 20px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }

  .modal-title {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 8px;
  }

  .modal-msg {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .modal-btn {
    width: 100%;
    padding: 18px;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    border: 2px solid;
  }

  .modal-btn.danger {
    background: var(--high);
    border-color: var(--high);
    color: var(--accent-text);
  }

  .modal-btn.danger:active { background: #ef4444; }

  .modal-btn.cancel {
    background: var(--surface2);
    border-color: #444;
    color: var(--text);
  }

  .modal-btn.cancel:active { background: #2a2a2a; }

  /* Loading/error */
  .status {
    text-align: center;
    padding: 40px 16px;
    color: var(--muted);
    font-size: 1.1rem;
    font-weight: 700;
  }

  .status.error { color: var(--high); }
</style>
</head>
<body>

<h1>🛍 Merch Calc</h1>
<div class="subtitle" id="last-updated">Loading data…</div>

<div id="app" style="display:none">

  <!-- Tax Toggle -->
  <div class="tax-row">
    <span class="tax-label">+ Tax (8.5%)</span>
    <label class="toggle-switch">
      <input type="checkbox" id="taxToggle" onchange="render()">
      <span class="slider"></span>
    </label>
  </div>

  <!-- Card Fee Toggle -->
  <div class="tax-row">
    <span class="tax-label">+ Card Fee ($2.00)</span>
    <label class="toggle-switch">
      <input type="checkbox" id="cardToggle" onchange="render()">
      <span class="slider"></span>
    </label>
  </div>

  <!-- Items -->
  <div class="items-grid" id="items-grid"></div>

  <!-- Totals -->
  <div class="totals-box">
    <div class="order-items" id="order-items">
      <div class="order-empty">nothing yet</div>
    </div>
    <div class="total-line">
      <span class="label">Subtotal</span>
      <span id="subtotal">$0.00</span>
    </div>
    <div class="total-line" id="tax-line" style="display:none">
      <span class="label">Tax (8.5%)</span>
      <span id="tax-amount">$0.00</span>
    </div>
    <div class="total-line" id="card-line" style="display:none">
      <span class="label">Card Fee</span>
      <span id="card-amount">$2.00</span>
    </div>
    <div class="total-line grand-total">
      <span class="label">TOTAL</span>
      <span id="grand-total">$0.00</span>
    </div>
  </div>

  <button class="complete-btn" id="completeBtn" onclick="completeSale()" disabled>✓ Complete Sale</button>
  <div class="sale-confirm" id="saleConfirm" style="display:none"></div>

  <button class="reset-btn" onclick="askReset()">↺ Start New Day</button>

  <div class="export-row">
    <button class="export-btn" id="exportBtn" onclick="exportSalesCSV()" disabled>⬇ Export Sales CSV</button>
  </div>
</div>

<!-- Start-new-day confirmation -->
<div class="modal-overlay" id="resetModal">
  <div class="modal-box">
    <div class="modal-title">Start a new day?</div>
    <div class="modal-msg" id="resetMsg"></div>
    <div class="modal-actions">
      <button class="modal-btn danger" onclick="confirmReset()">Yes, start new day</button>
      <button class="modal-btn cancel" onclick="closeReset()">Cancel</button>
    </div>
  </div>
</div>

<div class="status" id="status">Fetching prices…</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSN5_ovygfet8p9Pr9T9Vlek8PCD7EKOA1UGxAVY4gliPrW-UlzPaYHvufQy1UZX9e8JbhR7mmldHA9/pub?output=csv';
const SALES_LOG_KEY = 'merchSalesLog';
const EXPORT_SEQ_KEY = 'merchExportSeq';
const SALE_SEQ_KEY = 'merchSaleSeq';
const COMBO_SEP = '␟';

let items = [];
let quantities = {};    // comboKey -> qty
let comboMeta = {};     // comboKey -> {name, v1, v2, price}
let selections = {};    // item name -> {v1, v2} currently chosen in dropdowns
let salesLog = loadSalesLog();

// Quote-aware CSV parser: handles commas and escaped quotes inside "..." fields
function parseCSVRows(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ',') {
      row.push(field); field = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      rows.push(row); row = [];
    } else {
      field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseCSV(text) {
  const rows = parseCSVRows(text.trim());
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim().toLowerCase());
  return rows.slice(1).map(cols => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (cols[i] !== undefined ? cols[i] : '').trim());
    return obj;
  }).filter(r => r['name'] && r['name'].trim());
}

function getVarOptions(item, key) {
  const raw = (item[key] || '').trim();
  if (!raw) return [];
  return raw.split(',').map(s => s.trim()).filter(Boolean);
}

function comboKey(name, v1, v2) {
  return [name, v1, v2].join(COMBO_SEP);
}

function displayName(name, v1, v2) {
  let s = name;
  if (v1) s += ` (${v1})`;
  if (v2) s += ` (${v2})`;
  return s;
}

function ensureSelection(name, opts1, opts2) {
  if (!selections[name]) {
    selections[name] = { v1: opts1[0] || '', v2: opts2[0] || '' };
  }
  return selections[name];
}

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function varSelectHtml(idx, dim, options, selectedVal) {
  const opts = options.map(o =>
    `<option value="${escHtml(o)}"${o === selectedVal ? ' selected' : ''}>${escHtml(o)}</option>`
  ).join('');
  return `<select class="var-select" onchange="selectVar(${idx}, '${dim}', this.value)">${opts}</select>`;
}

function render() {
  const grid = document.getElementById('items-grid');
  const taxOn = document.getElementById('taxToggle').checked;

  grid.innerHTML = items.map((item, idx) => {
    const price = parseFloat(item['price']) || 0;
    const opts1 = getVarOptions(item, 'var1');
    const opts2 = getVarOptions(item, 'var2');
    const sel = ensureSelection(item.name, opts1, opts2);
    const key = comboKey(item.name, sel.v1, sel.v2);
    const qty = quantities[key] || 0;

    let selectsHtml = '';
    if (opts1.length) selectsHtml += varSelectHtml(idx, 'v1', opts1, sel.v1);
    if (opts2.length) selectsHtml += varSelectHtml(idx, 'v2', opts2, sel.v2);

    return `
      <div class="item-row">
        <div class="item-head">
          <span class="item-name">${escHtml(item.name)}</span>
          <span class="item-price">$${price.toFixed(2)}</span>
        </div>
        <div class="item-bottom">
          <div class="var-selects">${selectsHtml}</div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
            <div class="qty-display">${qty}</div>
            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
          </div>
        </div>
      </div>`;
  }).join('');

  // Totals — sum across every variety combination in the cart
  const comboKeys = Object.keys(quantities).filter(k => quantities[k] > 0);
  const subtotal = comboKeys.reduce((sum, k) => {
    const m = comboMeta[k];
    return sum + quantities[k] * (m ? m.price : 0);
  }, 0);

  const cardOn = document.getElementById('cardToggle').checked;
  const tax = taxOn ? subtotal * 0.085 : 0;
  const card = cardOn ? 2 : 0;
  const total = subtotal + tax + card;

  document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
  document.getElementById('tax-amount').textContent = `$${tax.toFixed(2)}`;
  document.getElementById('grand-total').textContent = `$${total.toFixed(2)}`;
  document.getElementById('tax-line').style.display = taxOn ? 'flex' : 'none';
  document.getElementById('card-line').style.display = cardOn ? 'flex' : 'none';

  // Order summary — one line per variety combination
  const orderItems = document.getElementById('order-items');
  if (comboKeys.length === 0) {
    orderItems.innerHTML = '<div class="order-empty">nothing yet</div>';
  } else {
    orderItems.innerHTML = comboKeys.map(k => {
      const m = comboMeta[k];
      const qty = quantities[k];
      const lineTotal = qty * m.price;
      return `<div class="order-item-line">
        <span class="item-label"><em>${qty}×</em>${escHtml(displayName(m.name, m.v1, m.v2))}</span>
        <span>$${lineTotal.toFixed(2)}</span>
      </div>`;
    }).join('');
  }

  document.getElementById('completeBtn').disabled = comboKeys.length === 0;
}

function loadSalesLog() {
  try {
    return JSON.parse(localStorage.getItem(SALES_LOG_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function saveSalesLog() {
  localStorage.setItem(SALES_LOG_KEY, JSON.stringify(salesLog));
}

function csvEscape(val) {
  const s = String(val);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function updateExportBtn() {
  const saleCount = new Set(salesLog.map(r => r.saleId)).size;
  const btn = document.getElementById('exportBtn');
  btn.disabled = saleCount === 0;
  btn.textContent = saleCount === 0
    ? '⬇ Export Sales CSV'
    : `⬇ Export Sales CSV (${saleCount} sale${saleCount === 1 ? '' : 's'})`;
}

function nextSaleId() {
  const now = new Date();
  const yymmdd = now.getFullYear().toString().slice(2)
    + String(now.getMonth() + 1).padStart(2, '0')
    + String(now.getDate()).padStart(2, '0');
  let store = null;
  try { store = JSON.parse(localStorage.getItem(SALE_SEQ_KEY)); } catch (e) {}
  const seq = (store && store.date === yymmdd) ? store.seq + 1 : 1;
  localStorage.setItem(SALE_SEQ_KEY, JSON.stringify({ date: yymmdd, seq }));
  return `${yymmdd}.${String(seq).padStart(3, '0')}`;
}

function completeSale() {
  const taxOn = document.getElementById('taxToggle').checked;
  const cardOn = document.getElementById('cardToggle').checked;
  const comboKeys = Object.keys(quantities).filter(k => quantities[k] > 0);
  if (comboKeys.length === 0) return;

  const subtotal = comboKeys.reduce((sum, k) => sum + quantities[k] * comboMeta[k].price, 0);
  const tax = taxOn ? subtotal * 0.085 : 0;
  const card = cardOn ? 2 : 0;
  const total = subtotal + tax + card;

  const now = new Date();
  const saleId = nextSaleId();

  comboKeys.forEach(k => {
    const m = comboMeta[k];
    const qty = quantities[k];
    salesLog.push({
      saleId,
      date: now.toLocaleDateString(),
      item: displayName(m.name, m.v1, m.v2),
      qty,
      unitPrice: m.price,
      lineTotal: qty * m.price,
      taxApplied: taxOn ? 'yes' : 'no',
      cardFeeApplied: cardOn ? 'yes' : 'no',
      saleTotal: total
    });
  });

  saveSalesLog();
  clearCart();
  updateExportBtn();

  const confirm = document.getElementById('saleConfirm');
  confirm.textContent = `✓ Sale saved — $${total.toFixed(2)}`;
  confirm.style.display = 'block';
  clearTimeout(window._saleConfirmTimeout);
  window._saleConfirmTimeout = setTimeout(() => { confirm.style.display = 'none'; }, 3000);
}

function exportSalesCSV() {
  if (salesLog.length === 0) return;

  const headers = ['Sale ID', 'Date', 'Item', 'Qty', 'Unit Price', 'Line Total', 'Tax Applied', 'Card Fee Applied', 'Sale Total'];
  const rows = salesLog.map(r => [
    r.saleId, r.date, r.item, r.qty,
    r.unitPrice.toFixed(2), r.lineTotal.toFixed(2),
    r.taxApplied, r.cardFeeApplied, r.saleTotal.toFixed(2)
  ]);
  const csv = [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\n');

  const now = new Date();
  const yymmdd = now.getFullYear().toString().slice(2)
    + String(now.getMonth() + 1).padStart(2, '0')
    + String(now.getDate()).padStart(2, '0');
  const seq = (parseInt(localStorage.getItem(EXPORT_SEQ_KEY), 10) || 0) + 1;
  localStorage.setItem(EXPORT_SEQ_KEY, seq);

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `SALE_${yymmdd}-${seq}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function selectVar(idx, dim, value) {
  const item = items[idx];
  if (!item) return;
  const opts1 = getVarOptions(item, 'var1');
  const opts2 = getVarOptions(item, 'var2');
  const sel = ensureSelection(item.name, opts1, opts2);
  sel[dim] = value;
  render();
}

function changeQty(idx, delta) {
  const item = items[idx];
  if (!item) return;
  const opts1 = getVarOptions(item, 'var1');
  const opts2 = getVarOptions(item, 'var2');
  const sel = ensureSelection(item.name, opts1, opts2);
  const key = comboKey(item.name, sel.v1, sel.v2);
  const next = Math.max(0, (quantities[key] || 0) + delta);
  if (next === 0) {
    delete quantities[key];
    delete comboMeta[key];
  } else {
    quantities[key] = next;
    comboMeta[key] = { name: item.name, v1: sel.v1, v2: sel.v2, price: parseFloat(item['price']) || 0 };
  }
  render();
}

function clearCart() {
  quantities = {};
  comboMeta = {};
  render();
}

function askReset() {
  const saleCount = new Set(salesLog.map(r => r.saleId)).size;
  const msg = document.getElementById('resetMsg');
  if (saleCount > 0) {
    msg.innerHTML = `This clears the current order and <strong>permanently erases the ${saleCount} sale${saleCount === 1 ? '' : 's'} saved on this device</strong>. Export the Sales CSV first if you still need it — this can't be undone.`;
  } else {
    msg.textContent = 'This clears the current order and resets the tax / card fee toggles. No sales are saved yet.';
  }
  document.getElementById('resetModal').classList.add('open');
}

function closeReset() {
  document.getElementById('resetModal').classList.remove('open');
}

function confirmReset() {
  quantities = {};
  comboMeta = {};
  selections = {};
  salesLog = [];
  localStorage.removeItem(SALES_LOG_KEY);
  localStorage.removeItem(SALE_SEQ_KEY);
  document.getElementById('taxToggle').checked = false;
  document.getElementById('cardToggle').checked = false;
  render();
  updateExportBtn();
  closeReset();
}

async function loadData() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('Network error');
    const text = await res.text();
    items = parseCSV(text);
    items.sort((a, b) => (parseFloat(b['price']) || 0) - (parseFloat(a['price']) || 0));
    items.forEach(item => quantities[item.name] = 0);

    document.getElementById('status').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();

    render();
    updateExportBtn();
  } catch (e) {
    document.getElementById('status').textContent = '⚠ Could not load sheet. Check the share URL.';
    document.getElementById('status').className = 'status error';
  }
}

loadData();
</script>
